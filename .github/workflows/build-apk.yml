name: Build APK

# Run it from the Actions tab ("Run workflow"), or automatically on every push.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/ff-tournament-app-xnke18

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Needed to publish the APK as a GitHub Release.
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # React Native 0.76 targets JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # android/ is gitignored, so generate the native project in CI.
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # Release build bundles the JS into the APK so it runs standalone.
      # The Expo template signs release with the debug keystore, so no secrets needed.
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Show APK info
        run: ls -lh android/app/build/outputs/apk/release/

      # Give the APK a friendly, versioned filename.
      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk \
             "out/ArenaPlay-v1.0.0-build${{ github.run_number }}.apk"
          ls -lh out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arena-play-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90

      # Publish a Release so the APK has a direct download link that can be
      # tapped straight from a phone browser (no zip to extract).
      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Arena Play v1.0.0 (build ${{ github.run_number }})
          body: |
            Installable Android APK for Arena Play.

            **How to install:** tap the `.apk` below on your Android phone,
            then allow "install from unknown sources" if prompted.

            Demo logins (offline mode):
            - Admin: `admin@arena.test` / `admin123`
            - Staff: `staff@arena.test` / `admin123`

            Note: signed with a debug key — fine for installing and sharing,
            not for Play Store upload.
          files: out/*.apk
          draft: false
          prerelease: false
